name: Test RELEASE_TOKEN1 push

on:
  workflow_dispatch:

jobs:
  test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN1 }}

      - name: Push a throwaway commit to main using RELEASE_TOKEN1
        run: |
          echo "test push $(date -u)" > .release-token-test
          git config user.name "HaoSophareth"
          git config user.email "haosophareth070@gmail.com"
          git add .release-token-test
          git commit -m "test: verify RELEASE_TOKEN1 can push to protected main"
          git push origin main
